# TerraMetrics - portable local configuration
spring.application.name=TerraMetrics
server.port=8080
server.address=127.0.0.1
server.error.whitelabel.enabled=false

# Run from the project root; the included SQLite database lives in data/.
# Override with TERRAMETRICS_DB_PATH when needed (use forward slashes on Windows).
spring.datasource.url=jdbc:sqlite:${TERRAMETRICS_DB_PATH:data/climate.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=never

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
logging.level.root=INFO
logging.level.com.kkargas.terrametrics=INFO
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
